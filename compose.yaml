services:
  api:
    build: .
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: celery -A app.celery_app.celery worker --loglevel=INFO
    depends_on: [db, redis]
    volumes:
      - ./secrets:/run/secrets:ro
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    command: celery -A app.celery_app.celery beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on: [db, redis]
    volumes:
      - ./secrets:/run/secrets:ro
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskmate
      POSTGRES_USER: taskmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmate"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
